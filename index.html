<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Market Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard">
        <header>
            <h1>Stock Market Dashboard</h1>
        </header>
        <main>
            <section class="summary">
                <h2>Market Summary</h2>
                <div id="market-summary">
                    <!-- Market summary will be displayed here -->
                </div>
            </section>
            <section class="watchlist">
                <h2>Your Watchlist</h2>
                <ul id="watchlist">
                    <!-- Watchlist items will be dynamically added here -->
                </ul>
            </section>
            <section class="search">
                <input type="text" id="search" placeholder="Search for stocks...">
                <table id="stock-table">
                    <thead>
                        <tr>
                            <th>Stock Name</th>
                            <th>Price</th>
                            <th>Change</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Stock list will be dynamically added here -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
